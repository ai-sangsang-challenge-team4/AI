name: Offline regression and safe logs

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements-evaluation.txt
      - name: Install lightweight dependencies
        run: python -m pip install -r requirements-test.txt -r requirements-evaluation.txt
      - name: Run offline contracts, guardrails and safe log checks
        run: python -m pytest --aggregate-report reports/ci/aggregate.json
      - name: Verify the regression command and synthetic log samples
        run: python scripts/run_regression.py --log-file tests/fixtures/operational_log_samples.jsonl
      - name: Retain aggregate counts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-test-aggregate
          path: reports/ci/aggregate.json
          retention-days: 7
          if-no-files-found: ignore
